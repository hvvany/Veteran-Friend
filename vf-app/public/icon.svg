<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 연회색 라운드 배경 -->
  <rect width="200" height="200" rx="44" ry="44" fill="#EBEBEA"/>

  <!-- 금색 비대칭 V (왼쪽 팔이 더 높게 → 제2의 인생 표현) -->
  <polyline
    points="26,13 96,170 173,64"
    fill="none"
    stroke="#FBBF24"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 코발트블루 F - 28° 반시계 기울임 (누워있는 F) -->
  <g transform="rotate(-28, 100, 100)">
    <!-- 세로 획 -->
    <rect x="84" y="28" width="24" height="138" fill="#2E5BFF" rx="4"/>
    <!-- 상단 가로 획 -->
    <rect x="84" y="28" width="68" height="24" fill="#2E5BFF" rx="4"/>
    <!-- 중단 가로 획 -->
    <rect x="84" y="92" width="52" height="22" fill="#2E5BFF" rx="3"/>
  </g>
</svg>
