<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 앱 아이콘 배경 (연회색 라운드 사각형) -->
  <rect width="200" height="200" rx="44" ry="44" fill="#F4F4F5"/>

  <!-- 금색 비대칭 V: 왼쪽 팔이 더 높게 (은퇴 후에도 더 높이 날아오를 제2의 인생 표현) -->
  <polyline
    points="30,16 97,166 170,72"
    fill="none"
    stroke="#FBBF24"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 코발트블루 F 레터폼 (금색 V 위에 겹쳐서 표현) -->
  <!-- 세로 획 -->
  <rect x="88" y="22" width="23" height="155" fill="#2E5BFF" rx="4"/>
  <!-- 상단 가로 획 -->
  <rect x="88" y="22" width="72" height="23" fill="#2E5BFF" rx="4"/>
  <!-- 중단 가로 획 -->
  <rect x="88" y="90" width="55" height="21" fill="#2E5BFF" rx="3"/>
</svg>
