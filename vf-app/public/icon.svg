<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 배경: 연한 회색 라운드 사각형 -->
  <rect width="200" height="200" rx="44" ry="44" fill="#E5E4E0"/>

  <!-- 주황색 V (채워진 폴리곤) - F 뒤에 위치 -->
  <!-- 왼팔: (12,15)~(48,15) 상단, 아래로 수렴 / 오른팔: (138,15)~(174,15) 상단, 아래로 수렴 -->
  <polygon
    points="12,15 48,15 93,152 138,15 174,15 107,178 79,178"
    fill="#E88A28"
  />

  <!-- 파란 F (V 위에 오버레이) -->
  <!-- 세로 획 -->
  <rect x="68" y="13" width="30" height="166" fill="#1E3BAA" rx="4"/>
  <!-- 상단 가로 획 (V 오른팔 대부분 커버) -->
  <rect x="68" y="13" width="108" height="33" fill="#1E3BAA" rx="4"/>
  <!-- 중단 가로 획 -->
  <rect x="68" y="87" width="80" height="27" fill="#1E3BAA" rx="4"/>
</svg>
